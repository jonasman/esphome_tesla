substitutions:
  #device: https://www.waveshare.com/esp32-s3-rs485-can.htm
  device_name: esp-tesla
  friendly_name: ESPHome Tesla
  tx_pin: GPIO17 # RS485 TX (DI)
  rx_pin: GPIO18 # RS485 RX (RO)
  flow_control_pin: 21
  ct1_value_id: internal_meter_reading
  min_value: 0.0
  max_value: 45.0
  start_value: 0.0
  # serial <-> modbus bridge config
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  board_chip: "ESP32-S3"
  board_name: "WS RS485-CAN"
  # Shelly RPC-over-UDP config — must match the Shelly's udp_rpc dst (Sys.SetConfig)
  # and the event name used by the em_reading.js timer script on the Shelly.
  shelly_addr: "10.0.1.39"  # Shelly's IP, for reference only; the udp component can't filter by sender
  shelly_rpc_port: "1111"
  shelly_event_name: "em_reading"
  watchdog_failsafe_a: "25.0"
  watchdog_timeout_ms: "10000"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: esp32s3
  flash_size: 16MB

logger:
  level: INFO
  hardware_uart: USB_CDC
  logs:
    uart: INFO
    modbus: INFO
    modbus_controller: INFO
    wifi: INFO
    api: INFO
    ota: INFO
    http_request: INFO
    sensor: INFO
    switch: INFO
    number: INFO
    udp: INFO

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.12.0
  name_add_mac_suffix: false

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  - platform: esphome
    id: esphome_ota

web_server:
  port: 80
  version: 3

api:

# Shelly RPC-over-UDP listener — unicast, replaces the LNM multicast listener.
# The Shelly runs a script (see em_reading.js) that calls Shelly.emitEvent()
# on a 1s timer; with udp_rpc configured (Sys.SetConfig) that fires as a
# NotifyEvent datagram shaped like:
#   {"src":"shellyproem50-xxxx","method":"NotifyEvent",
#    "params":{"ts":...,"events":[{"component":"script:3","id":3,
#      "event":"em_reading","data":{"act_power":283.2,"current":1.23,"voltage":230.1},
#      "ts":...}]}}
udp:
  - id: shelly_rpc
    port: ${shelly_rpc_port}
    on_receive:
      then:
        - lambda: |-
            if (!id(enable_shelly)) return;

            // NOTE: the udp component's receive buffer is capped at 508 bytes,
            // so an unrelated large frame may arrive truncated and fail to
            // parse as JSON; our em_reading events are small and unaffected.
            std::string json_str(reinterpret_cast<const char*>(data.data()), data.size());

            json::parse_json(json_str, [](JsonObject root) -> bool {
              if (!root["params"]["events"].is<JsonArray>()) return false;

              for (JsonVariant ev : root["params"]["events"].as<JsonArray>()) {
                const char *event_name = ev["event"] | "";
                if (strcmp(event_name, "${shelly_event_name}") != 0) continue;
                if (!ev["data"].is<JsonObject>()) continue;
                JsonObject em = ev["data"];

                if (!em["current"].is<double>()) return false;
                float current = em["current"];

                // Set power BEFORE publishing current (avoids race condition,
                // same ordering as the old MQTT/LNM handler).
                if (em["act_power"].is<double>()) {
                  float power = em["act_power"];
                  id(ct1_power_w) = power;
                  id(ct_total_w) = power;
                }

                if (em["voltage"].is<double>()) {
                  id(ct1_voltage_v) = (float) em["voltage"];
                }

                // Mark fresh data arrival for the watchdog
                id(last_shelly_rx_ms) = millis();

                // Publish current LAST (triggers on_value on internal_meter_reading)
                id(${ct1_value_id}).publish_state(round(current * 10) / 10);
                return true;
              }
              return false;
            });

# Watchdog: if no RPC packet for 10s, drop the current to 0 so the
# Wall Connector backs off rather than charging based on stale data.
interval:
  - interval: 2s
    then:
      - lambda: |-
          if (!id(enable_shelly)) return;
          if (id(last_shelly_rx_ms) == 0) return;  // never received yet, leave alone
          uint32_t age = millis() - id(last_shelly_rx_ms);
          if (age > ${watchdog_timeout_ms}) {
            float failsafe = ${watchdog_failsafe_a};
            if (id(${ct1_value_id}).state != failsafe) {
              ESP_LOGW("shelly-rpc",
                       "No RPC packet for %u ms, forcing reading to %.1fA (failsafe)",
                       age, failsafe);
              id(${ct1_value_id}).publish_state(failsafe);
            }
          }

globals:
  - id: enable_shelly
    type: bool
    initial_value: "true"
    restore_value: true

  - id: last_shelly_rx_ms
    type: uint32_t
    initial_value: "0"

  - id: ct1_voltage_v
    type: float
    initial_value: "230"

  - id: ct1_power_w
    type: float
    initial_value: "0.0"
  - id: ct2_power_w
    type: float
    initial_value: "0.0"
  - id: ct3_power_w
    type: float
    initial_value: "0.0"
  - id: ct4_power_w
    type: float
    initial_value: "0.0"
  - id: ct_total_w
    type: float
    initial_value: "0.0"

  - id: ct1_current_a
    type: float
    initial_value: "0.0"
  - id: ct2_current_a
    type: float
    initial_value: "0.0"
  - id: ct3_current_a
    type: float
    initial_value: "0.0"
  - id: ct4_current_a
    type: float
    initial_value: "0.0"
  - id: ct_total_a
    type: float
    initial_value: "0.0"

switch:
  - platform: template
    id: read_from_shelly
    name: "Read from Shelly (RPC)"
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(enable_shelly);
    turn_on_action:
      globals.set:
        id: enable_shelly
        value: "true"
    turn_off_action:
      globals.set:
        id: enable_shelly
        value: "false"

button:
  - platform: restart
    name: "${friendly_name} Restart"

number:
  - platform: template
    id: meter_reading
    name: "Meter Reading"
    icon: "mdi:meter-electric"
    disabled_by_default: false
    unit_of_measurement: "A"
    min_value: ${min_value}
    max_value: ${max_value}
    step: 0.1
    initial_value: ${start_value}
    optimistic: true
    on_value:
      then:
        lambda: |-
          id(internal_meter_reading).publish_state(id(meter_reading).state);

  - platform: template
    id: internal_meter_reading
    icon: "mdi:meter-electric"
    disabled_by_default: false
    unit_of_measurement: "A"
    min_value: ${min_value}
    max_value: ${max_value}
    step: 0.1
    initial_value: ${start_value}
    optimistic: true
    on_value:
      then:
        lambda: |-
          // Single-phase: only CT1 has real values
          id(ct1_current_a) = id(${ct1_value_id}).state + id(reading_offset).state;
          id(ct_total_a) = id(ct1_current_a);

          // Use the RPC-measured power only while Shelly is enabled AND fresh (i.e. at
          // least one packet received, within the watchdog timeout). Otherwise (Shelly
          // off, never received yet, or stale/failsafe) derive power from V*A so it always
          // matches the current value.
          bool shelly_live = id(enable_shelly) && id(last_shelly_rx_ms) != 0 &&
                            (millis() - id(last_shelly_rx_ms) <= ${watchdog_timeout_ms});
          if (!shelly_live) {
            id(ct1_power_w) = id(ct1_voltage_v) * id(ct1_current_a);
            id(ct_total_w) = id(ct1_power_w);
          }

  - platform: template
    id: reading_offset
    name: "Meter reading offset"
    unit_of_measurement: "A"
    initial_value: 0
    step: 0.1
    min_value: 0
    max_value: ${max_value}
    optimistic: true
    restore_value: true
    on_value:
      then:
        lambda: |-
          id(${ct1_value_id}).publish_state(id(${ct1_value_id}).state);

sensor:
  - platform: template
    name: "CT Sensor 1 current"
    unit_of_measurement: A
    state_class: measurement
    device_class: current
    lambda: |-
      return id(ct1_current_a);
    update_interval: 5s
    accuracy_decimals: 1
    disabled_by_default: true

  - platform: template
    name: "CT Sensor 1 power"
    unit_of_measurement: W
    state_class: measurement
    device_class: power
    lambda: |-
      return id(ct1_power_w);
    update_interval: 5s
    accuracy_decimals: 0
    disabled_by_default: true

uart:
  - id: wallconn_uart
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: ${baud_rate}
    data_bits: ${data_bits}
    parity: ${parity}
    stop_bits: ${stop_bits}
    flow_control_pin: ${flow_control_pin}
    debug:
      direction: BOTH
      dummy_receiver: false
      after:
        timeout: 50ms
      sequence:
        - lambda: |-
            UARTDebug::log_hex(direction, bytes, ',');

modbus:
  - id: wallconn_modbus
    uart_id: wallconn_uart
    role: server

modbus_server:
  - id: wc_mb_server
    modbus_id: wallconn_modbus
    address: 1
    registers:
      # Serial number / MAC address
      - { address: 1, value_type: U_WORD, read_lambda: 'return 0x3078;' }
      - { address: 2, value_type: U_WORD, read_lambda: 'return 0x3030;' }
      - { address: 3, value_type: U_WORD, read_lambda: 'return 0x3030;' }
      - { address: 4, value_type: U_WORD, read_lambda: 'return 0x3034;' }
      - { address: 5, value_type: U_WORD, read_lambda: 'return 0x3731;' }
      - { address: 6, value_type: U_WORD, read_lambda: 'return 0x3442;' }
      - { address: 7, value_type: U_WORD, read_lambda: 'return 0x3035;' }
      - { address: 8, value_type: U_WORD, read_lambda: 'return 0x3638;' }
      - { address: 9, value_type: U_WORD, read_lambda: 'return 0x3631;' }
      - { address: 10, value_type: U_WORD, read_lambda: 'return 0x0000;' }

      # "1.6.1-Tesla"
      - { address: 11, value_type: U_WORD, read_lambda: 'return 0x312E;' }
      - { address: 12, value_type: U_WORD, read_lambda: 'return 0x362E;' }
      - { address: 13, value_type: U_WORD, read_lambda: 'return 0x312D;' }
      - { address: 14, value_type: U_WORD, read_lambda: 'return 0x5465;' }
      - { address: 15, value_type: U_WORD, read_lambda: 'return 0x736C;' }
      - { address: 16, value_type: U_WORD, read_lambda: 'return 0x6100;' }

      # Reserved
      - { address: 17, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 18, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 19, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 20, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }

      # "012.00020A.H"
      - { address: 21, value_type: U_WORD, read_lambda: 'return 0x3031;' }
      - { address: 22, value_type: U_WORD, read_lambda: 'return 0x322E;' }
      - { address: 23, value_type: U_WORD, read_lambda: 'return 0x3030;' }
      - { address: 24, value_type: U_WORD, read_lambda: 'return 0x3032;' }
      - { address: 25, value_type: U_WORD, read_lambda: 'return 0x3041;' }
      - { address: 26, value_type: U_WORD, read_lambda: 'return 0x2E48;' }
      - { address: 27, value_type: U_WORD, read_lambda: 'return 0x0000;' }

      - { address: 28, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }

      # Meter number "90954"
      - { address: 29, value_type: U_WORD, read_lambda: 'return 0x3930;' }
      - { address: 30, value_type: U_WORD, read_lambda: 'return 0x3935;' }
      - { address: 31, value_type: U_WORD, read_lambda: 'return 0x3400;' }

      # Model "VAH4810AB0231"
      - { address: 32, value_type: U_WORD, read_lambda: 'return 0x5641;' }
      - { address: 33, value_type: U_WORD, read_lambda: 'return 0x4834;' }
      - { address: 34, value_type: U_WORD, read_lambda: 'return 0x3831;' }
      - { address: 35, value_type: U_WORD, read_lambda: 'return 0x3041;' }
      - { address: 36, value_type: U_WORD, read_lambda: 'return 0x4230;' }
      - { address: 37, value_type: U_WORD, read_lambda: 'return 0x3233;' }
      - { address: 38, value_type: U_WORD, read_lambda: 'return 0x3100;' }

      # Reserved
      - { address: 39, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 40, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 41, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 42, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 43, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 44, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 45, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }
      - { address: 46, value_type: U_WORD, read_lambda: 'return 0xFFFF;' }

      # MAC "04:71:4B:05:68:61"
      - { address: 47, value_type: U_WORD, read_lambda: 'return 0x3034;' }
      - { address: 48, value_type: U_WORD, read_lambda: 'return 0x3A37;' }
      - { address: 49, value_type: U_WORD, read_lambda: 'return 0x313A;' }
      - { address: 50, value_type: U_WORD, read_lambda: 'return 0x3442;' }
      - { address: 51, value_type: U_WORD, read_lambda: 'return 0x3A30;' }
      - { address: 52, value_type: U_WORD, read_lambda: 'return 0x353A;' }
      - { address: 53, value_type: U_WORD, read_lambda: 'return 0x3638;' }
      - { address: 54, value_type: U_WORD, read_lambda: 'return 0x3A36;' }
      - { address: 55, value_type: U_WORD, read_lambda: 'return 0x3100;' }

      # CT1-4 power W
      - { address: 0x88, value_type: FP32, read_lambda: 'return id(ct1_power_w);' }
      - { address: 0x8A, value_type: FP32, read_lambda: 'return id(ct2_power_w);' }
      - { address: 0x8C, value_type: FP32, read_lambda: 'return id(ct3_power_w);' }
      - { address: 0x8E, value_type: FP32, read_lambda: 'return id(ct4_power_w);' }

      # Aggregate watts
      - { address: 0x90, value_type: FP32, read_lambda: 'return id(ct_total_w);' }
      - { address: 0x92, value_type: U_WORD, read_lambda: 'return 0;' }

      # CT1-4 current amps
      - { address: 0xF4, value_type: FP32, read_lambda: 'return id(ct1_current_a);' }
      - { address: 0xF6, value_type: FP32, read_lambda: 'return id(ct2_current_a);' }
      - { address: 0xF8, value_type: FP32, read_lambda: 'return id(ct3_current_a);' }
      - { address: 0xFA, value_type: FP32, read_lambda: 'return id(ct4_current_a);' }

      # Total amps
      - { address: 0xFC, value_type: FP32, read_lambda: 'return id(ct_total_a);' }

      # Initialization handshake
      - { address: 40002, value_type: U_WORD, read_lambda: 'return 0x0001;' }
      - { address: 40003, value_type: U_WORD, read_lambda: 'return 0x0042;' }
      - { address: 40004, value_type: U_WORD, read_lambda: 'return 0x4765;' }
      - { address: 40005, value_type: U_WORD, read_lambda: 'return 0x6E65;' }
      - { address: 40006, value_type: U_WORD, read_lambda: 'return 0x7261;' }
      - { address: 40007, value_type: U_WORD, read_lambda: 'return 0x6300;' }
